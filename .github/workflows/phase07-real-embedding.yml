name: Phase07 D03 Real Embedding CPU Benchmark

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measured-cpu-model:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        candidate:
          - e5-small
          - minilm-l12
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DOWNLOAD_TIMEOUT: "180"
      HF_HOME: ${{ runner.temp }}/hf-embedding
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned local model runtime
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install sentence-transformers==5.1.2 psutil==7.1.0 numpy==2.2.6
      - name: Run real safetensors CPU embeddings
        run: |
          python -m benchmarks.phase07.run_real_embedding --model ${{ matrix.candidate }} --output results/${{ matrix.candidate }}.json
      - name: Preserve true inference or blocked result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d03-measured-${{ matrix.candidate }}
          path: results/
          if-no-files-found: warn
          retention-days: 14
