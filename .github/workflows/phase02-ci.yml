name: Phase 02 checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python -m compileall -q src scripts tests
      - run: python scripts/validate_phase01.py
      - run: python -O scripts/validate_phase01.py
      - run: python -m pytest -q
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pip-audit -r requirements.txt --strict
      - run: cyclonedx-py environment --output-format JSON --output-file sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-sbom
          path: sbom.json
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag smart-chatbot-service:phase02 .
      - run: docker inspect smart-chatbot-service:phase02 --format '{{.Config.User}}'

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
