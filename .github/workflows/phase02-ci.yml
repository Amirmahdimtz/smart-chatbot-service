name: Foundation, PostgreSQL and Qdrant checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install isolated OCR dependencies for synthetic fixtures
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-fas tesseract-ocr-ara tesseract-ocr-eng fonts-dejavu-core
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python -m compileall -q src scripts tests
      - run: python scripts/validate_phase01.py
      - run: python -O scripts/validate_phase01.py
      - run: python -m pytest -q
      - name: Show actionable Ruff import diff without modifying CI source
        run: ruff check --diff src tests || true
      - run: ruff check src tests
      - name: Formatter diff for audit
        run: ruff format --diff src tests || true
      - run: ruff format --check src tests
      - run: pip-audit -r requirements.txt --strict
      - run: cyclonedx-py environment --output-format JSON --output-file sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-sbom
          path: sbom.json
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag smart-chatbot-service:phase04 .
      - run: docker inspect smart-chatbot-service:phase04 --format '{{.Config.User}}'
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_DB: scb_phase03_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d scb_phase03_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SCB_ENV: development
      SCB_ZONE: public
      SCB_DATABASE_ENABLED: 'true'
      SCB_DATABASE_URL: postgresql+asyncpg://ci:@127.0.0.1:5432/scb_phase03_test
      SCB_PHASE03_TEST_DATABASE_URL: postgresql+asyncpg://ci:@127.0.0.1:5432/scb_phase03_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --requirement requirements-dev.txt
      - name: Fresh install, repeat upgrade, and schema drift detection
        run: |
          python src/infrastructure/scripts/run_migrations.py --upgrade
          python src/infrastructure/scripts/run_migrations.py --upgrade
          python src/infrastructure/scripts/run_migrations.py --check
      - run: python -m pytest -q tests/test_phase03_postgresql.py
      - name: Disposable test-only reverse strategy and restore
        run: |
          python src/infrastructure/scripts/run_migrations.py --downgrade-test-only
          python src/infrastructure/scripts/run_migrations.py --upgrade
          python src/infrastructure/scripts/run_migrations.py --check
  qdrant-integration:
    runs-on: ubuntu-latest
    env:
      SCB_PHASE04_TEST_QDRANT_URL: http://127.0.0.1:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Start disposable authenticated Qdrant with ephemeral credential
        shell: bash
        run: |
          key="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$key"
          echo "SCB_PHASE04_TEST_QDRANT_KEY=$key" >> "$GITHUB_ENV"
          docker run -d --rm --name scb-phase04-ci \
            -e QDRANT__SERVICE__API_KEY="$key" \
            -p 127.0.0.1:6333:6333 qdrant/qdrant:v1.20.0
      - run: python -m pip install --requirement requirements-dev.txt
      - name: Wait for authenticated real Qdrant
        run: |
          for i in $(seq 1 40); do
            if curl -fsS -H "api-key: $SCB_PHASE04_TEST_QDRANT_KEY" http://127.0.0.1:6333/collections >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: python -m pytest -q tests/test_phase04_qdrant.py
      - name: Phase07 real Qdrant hidden-stage and replay integration
        run: python -m pytest -q tests/test_phase07_qdrant.py
      - name: Clean disposable Qdrant
        if: always()
        run: docker rm -f scb-phase04-ci || true

  ingestion-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_DB: scb_phase05_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d scb_phase05_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SCB_ENV: development
      SCB_ZONE: internal
      SCB_DATABASE_ENABLED: 'true'
      SCB_DATABASE_URL: postgresql+asyncpg://ci:@127.0.0.1:5432/scb_phase05_test
      SCB_PHASE05_TEST_ENABLED: 'true'
      SCB_INGESTION_ENABLED: 'true'
      SCB_INGESTION_S3_URL: http://127.0.0.1:9000
      SCB_INGESTION_S3_BUCKET: scb-quarantine
      SCB_PHASE05_TEST_S3_IMAGE: chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
      SCB_PHASE05_TEST_CLAMAV_IMAGE: clamav/clamav@sha256:3bba6dd5ac6663d55b80f86a3126e146612d93b593cc2617188d13f637d91260
      SCB_INGESTION_CLAMD_HOST: 127.0.0.1
      SCB_INGESTION_CLAMD_PORT: '3310'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install isolated OCR dependencies for synthetic fixtures
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-fas tesseract-ocr-ara tesseract-ocr-eng fonts-dejavu-core
      - run: python -m pip install --requirement requirements-dev.txt
      - name: Install pinned Sigstore cosign verifier
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22
      - name: Verify upstream signed release identity for exact S3 image digest
        shell: bash
        run: |
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github.com/seaweedfs/seaweedfs/\.github/workflows/container_release_unified\.yml@refs/tags/4\.48$' \
            "$SCB_PHASE05_TEST_S3_IMAGE" >/dev/null
      - name: Start synthetic-only real S3 and ClamAV services
        shell: bash
        run: |
          user="$(python -c 'import secrets; print("t" + secrets.token_hex(12))')"
          password="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$user"
          echo "::add-mask::$password"
          echo "SCB_INGESTION_S3_ACCESS_KEY=$user" >> "$GITHUB_ENV"
          echo "SCB_INGESTION_S3_SECRET_KEY=$password" >> "$GITHUB_ENV"
          docker run -d --rm --name scb-phase05-s3 \
            -e AWS_ACCESS_KEY_ID="$user" -e AWS_SECRET_ACCESS_KEY="$password" \
            -e S3_BUCKET=scb-quarantine \
            -p 127.0.0.1:9000:8333 \
            -v scb-phase05-seaweed-data:/data \
            chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
          docker run -d --rm --name scb-phase05-clamav \
            -e CLAMAV_NO_FRESHCLAMD=true \
            -p 127.0.0.1:3310:3310 clamav/clamav@sha256:3bba6dd5ac6663d55b80f86a3126e146612d93b593cc2617188d13f637d91260
      - name: Wait for real dependencies and create private quarantine bucket
        shell: bash
        run: |
          python - <<'PY'
          import os
          import socket
          import time

          import boto3
          from botocore.config import Config

          s3 = boto3.client(
              "s3", endpoint_url=os.environ["SCB_INGESTION_S3_URL"],
              aws_access_key_id=os.environ["SCB_INGESTION_S3_ACCESS_KEY"],
              aws_secret_access_key=os.environ["SCB_INGESTION_S3_SECRET_KEY"],
              region_name="us-east-1", config=Config(s3={"addressing_style": "path"}),
          )
          for i in range(100):
              try:
                  with socket.create_connection(("127.0.0.1", 3310), timeout=2):
                      # SeaweedFS mini may create S3_BUCKET at startup.
                      s3.head_bucket(Bucket="scb-quarantine")
                      break
              except Exception:
                  time.sleep(2)
          else:
              raise SystemExit("Real synthetic dependencies not ready")
          PY
      - name: Real PostgreSQL upgrade, repeat, and migration drift check
        run: |
          python src/infrastructure/scripts/run_migrations.py --upgrade
          python src/infrastructure/scripts/run_migrations.py --upgrade
          python src/infrastructure/scripts/run_migrations.py --check
      - name: Disposable migration reverse/re-upgrade before writing test records
        run: |
          python src/infrastructure/scripts/run_migrations.py --downgrade-test-only
          python src/infrastructure/scripts/run_migrations.py --upgrade
          python src/infrastructure/scripts/run_migrations.py --check
      - run: python -m pytest -q tests/test_phase05_integration.py
      - name: Phase06 real scanned-PDF Persian OCR Gold Fixture CER
        run: |
          tesseract --version | head -n 1
          pdftoppm -v 2>&1 | head -n 1
          python -m pytest -q -s tests/test_phase06_processing.py::test_real_scanned_persian_pdf_ocr
      - name: Real dependency outage/recovery injection on disposable CI containers only
        run: python -m pytest -q tests/test_phase05_service_outages.py
      - name: Remove synthetic containers
        if: always()
        run: |
          docker logs --tail 30 scb-phase05-clamav || true
          docker rm -f scb-phase05-clamav scb-phase05-s3 || true
          docker volume rm scb-phase05-seaweed-data || true

  phase07-d03-cpu-benchmark:
    name: Phase07 D03 actual model PG Qdrant staging
    if: github.head_ref == 'feat/phase07-real-embedding-index-staging'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        model: [e5-small, minilm-l12]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_DB: scb_phase07_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d scb_phase07_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SCB_ENV: development
      SCB_ZONE: internal
      SCB_DATABASE_ENABLED: 'true'
      SCB_DATABASE_URL: postgresql+asyncpg://ci:@127.0.0.1:5432/scb_phase07_test
      SCB_QDRANT_ENABLED: 'true'
      SCB_QDRANT_ZONE: internal
      SCB_QDRANT_URL: http://127.0.0.1:6333
      SCB_QDRANT_DIMENSION: '384'
      SCB_QDRANT_DISTANCE: Cosine
      SCB_PHASE07_REAL_TEST_ENABLED: 'true'
      SCB_PHASE07_REAL_CANDIDATE: ${{ matrix.model }}
      SCB_PHASE04_TEST_QDRANT_URL: http://127.0.0.1:6333
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '180'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Start isolated authenticated Qdrant
        shell: bash
        run: |
          key="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$key"
          echo "SCB_QDRANT_API_KEY=$key" >> "$GITHUB_ENV"
          echo "SCB_PHASE04_TEST_QDRANT_KEY=$key" >> "$GITHUB_ENV"
          docker run -d --rm --name scb-phase07-real-d03 \
            -e QDRANT__SERVICE__API_KEY="$key" \
            -p 127.0.0.1:6333:6333 qdrant/qdrant:v1.20.0
      - name: Install actual local CPU model and database/runtime dependencies
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install sentence-transformers==5.1.2 psutil==7.1.0 numpy==2.2.6
          python -m pip install --requirement requirements-dev.txt
      - name: Verify Qdrant and migrate REAL isolated PostgreSQL schema
        run: |
          for i in $(seq 1 40); do
            if curl -fsS -H "api-key: $SCB_QDRANT_API_KEY" http://127.0.0.1:6333/collections >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS -H "api-key: $SCB_QDRANT_API_KEY" http://127.0.0.1:6333/collections >/dev/null
          python src/infrastructure/scripts/run_migrations.py --upgrade
          python src/infrastructure/scripts/run_migrations.py --check
      - name: Actual Embedding CPU inference + PG source + hidden Qdrant E2E
        run: python -m pytest -q -s tests/test_phase07_real_pg_qdrant_embedding.py
      - name: Phase07 real durable PostgreSQL manifest, fenced lease, synthetic publish and revoke-first
        run: python -m pytest -q -s tests/test_phase07_durable_lifecycle.py
      - name: Benchmark same exact pinned model and synthetic corpus
        run: python -m benchmarks.phase07.run_real_embedding --model ${{ matrix.model }} --output results/${{ matrix.model }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measured-model-${{ matrix.model }}
          path: results/
          if-no-files-found: warn
          retention-days: 14
      - name: Cleanup synthetic Qdrant
        if: always()
        run: docker rm -f scb-phase07-real-d03 || true
