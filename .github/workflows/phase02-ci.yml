name: Foundation, PostgreSQL and Qdrant checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python -m compileall -q src scripts tests
      - run: python scripts/validate_phase01.py
      - run: python -O scripts/validate_phase01.py
      - run: python -m pytest -q
      - run: ruff check src tests
      - run: ruff format --diff src tests
      - run: ruff format --check src tests
      - run: pip-audit -r requirements.txt --strict
      - run: cyclonedx-py environment --output-format JSON --output-file sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-sbom
          path: sbom.json
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag smart-chatbot-service:phase04 .
      - run: docker inspect smart-chatbot-service:phase04 --format '{{.Config.User}}'
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_DB: scb_phase03_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d scb_phase03_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SCB_ENV: development
      SCB_ZONE: public
      SCB_DATABASE_ENABLED: 'true'
      SCB_DATABASE_URL: postgresql+asyncpg://ci:@127.0.0.1:5432/scb_phase03_test
      SCB_PHASE03_TEST_DATABASE_URL: postgresql+asyncpg://ci:@127.0.0.1:5432/scb_phase03_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --requirement requirements-dev.txt
      - name: Fresh install, repeat upgrade, and schema drift detection
        run: |
          python src/infrastructure/scripts/run_migrations.py --upgrade
          python src/infrastructure/scripts/run_migrations.py --upgrade
          python src/infrastructure/scripts/run_migrations.py --check
      - run: python -m pytest -q tests/test_phase03_postgresql.py
      - name: Disposable test-only reverse strategy and restore
        run: |
          python src/infrastructure/scripts/run_migrations.py --downgrade-test-only
          python src/infrastructure/scripts/run_migrations.py --upgrade
          python src/infrastructure/scripts/run_migrations.py --check
  qdrant-integration:
    runs-on: ubuntu-latest
    env:
      SCB_PHASE04_TEST_QDRANT_URL: http://127.0.0.1:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Start disposable authenticated Qdrant with ephemeral credential
        shell: bash
        run: |
          key="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$key"
          echo "SCB_PHASE04_TEST_QDRANT_KEY=$key" >> "$GITHUB_ENV"
          docker run -d --rm --name scb-phase04-ci \
            -e QDRANT__SERVICE__API_KEY="$key" \
            -p 127.0.0.1:6333:6333 qdrant/qdrant:v1.20.0
      - run: python -m pip install --requirement requirements-dev.txt
      - name: Wait for authenticated real Qdrant
        run: |
          for i in $(seq 1 40); do
            if curl -fsS -H "api-key: $SCB_PHASE04_TEST_QDRANT_KEY" http://127.0.0.1:6333/collections >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: python -m pytest -q tests/test_phase04_qdrant.py
      - name: Clean disposable Qdrant
        if: always()
        run: docker rm -f scb-phase04-ci || true
