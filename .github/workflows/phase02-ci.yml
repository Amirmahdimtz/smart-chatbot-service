name: Foundation and PostgreSQL checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python -m compileall -q src scripts tests
      - run: python scripts/validate_phase01.py
      - run: python -O scripts/validate_phase01.py
      - run: python -m pytest -q
      - run: ruff check src tests
      - name: Temporary Phase 03 formatting diagnostic
        if: always()
        run: |
          ruff check --fix src tests
          ruff format src tests
          python - <<'PY'
          import base64
          from pathlib import Path
          paths = ["src/infrastructure/context/sql_db/psql_dbcontext.py","src/infrastructure/repositories/base/base_repository.py","src/infrastructure/models/entities.py","src/infrastructure/repositories/conversation/conversation_repository.py","src/core/services/conversation/conversation_service.py","src/infrastructure/alembic/env.py","src/infrastructure/alembic/versions/0001_operational_foundation.py","src/infrastructure/scripts/run_migrations.py","src/infrastructure/utils/config_reader.py","src/host/app.py","tests/test_phase03_postgresql.py","tests/test_phase02_runtime.py"]
          for filename in paths:
              print('SCB_FORMATTED:' + filename + ':' + base64.b64encode(Path(filename).read_bytes()).decode())
          PY
      - run: ruff format --check src tests
      - run: pip-audit -r requirements.txt --strict
      - run: cyclonedx-py environment --output-format JSON --output-file sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-sbom
          path: sbom.json
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag smart-chatbot-service:phase02 .
      - run: docker inspect smart-chatbot-service:phase02 --format '{{.Config.User}}'

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_DB: scb_phase03_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d scb_phase03_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SCB_ENV: development
      SCB_ZONE: public
      SCB_DATABASE_ENABLED: 'true'
      SCB_DATABASE_URL: postgresql+asyncpg://ci:@127.0.0.1:5432/scb_phase03_test
      SCB_PHASE03_TEST_DATABASE_URL: postgresql+asyncpg://ci:@127.0.0.1:5432/scb_phase03_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --requirement requirements-dev.txt
      - name: Fresh install, repeat upgrade, and schema drift detection
        run: |
          python src/infrastructure/scripts/run_migrations.py --upgrade
          python src/infrastructure/scripts/run_migrations.py --upgrade
          python src/infrastructure/scripts/run_migrations.py --check
      - run: python -m pytest -q tests/test_phase03_postgresql.py
      - name: Disposable test-only reverse strategy and restore
        run: |
          python src/infrastructure/scripts/run_migrations.py --downgrade-test-only
          python src/infrastructure/scripts/run_migrations.py --upgrade
          python src/infrastructure/scripts/run_migrations.py --check
