name: Phase02 temporary format diff
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.15.5
      - name: Show Ruff formatting patch
        run: |
          ruff format --diff src/infrastructure/security/token_validator.py tests/test_phase02_security_regressions.py || true
